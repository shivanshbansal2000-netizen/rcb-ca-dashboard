name: Build Sector Map (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Build sector map
        run: python build_sector_map.py
        env:
          RCB_ISINS: ${{ secrets.RCB_ISINS }}

      - name: Commit sector map
        run: |
          git config user.name "MARVIN"
          git config user.email "actions@github.com"
          git add sector_map.json
          git diff --cached --quiet || git commit -m "data: sector map for RCB holdings"
          git push
